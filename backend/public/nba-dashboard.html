<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA / OBE Attainment Dashboard - GMCP</title>
    <link rel="icon" type="image/jpeg" href="images/logo.jpg">

    <!-- React 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- Babel Standalone (for JSX transformation) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS CDN (Play CDN - includes all utilities including print) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; }

        /* ── Print page setup ── */
        @page { size: A4 landscape; margin: 8mm 10mm; }

        @media print {
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            /* Compact Phase 2 mapping table (19 columns) for A4 landscape */
            #phase2-table th, #phase2-table td { font-size: 5.5pt !important; padding: 1pt 1.5pt !important; line-height: 1.05 !important; }
            /* Phase 3 final matrix */
            #phase3-table th, #phase3-table td { font-size: 7pt !important; padding: 2pt 3pt !important; }
            /* Page breaks */
            #phase2-section { page-break-before: always !important; break-before: page !important; }
            #phase3-section { page-break-before: always !important; break-before: page !important; }
            /* Phase 4 charts: force side-by-side in landscape */
            #phase4-charts { display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 16px !important; margin-top: 12px !important; padding-top: 4px !important; page-break-inside: avoid; break-inside: avoid; }
            #phase4-charts > div { min-height: 0 !important; padding: 12px !important; }
            #phase4-charts .chart-bar-area { height: 140px !important; }
        }
    </style>
</head>
<body>
    <!-- Fallback shown until React mounts -->
    <div id="root" style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#64748b;font-family:sans-serif;">
        <div style="text-align:center;"><div style="font-size:2rem;">⚙️</div><p style="margin-top:.5rem;">Loading OBE Dashboard...</p></div>
    </div>

    <script type="text/babel" data-presets="react">
        /* @jsxRuntime classic */
        const { useState, useMemo, useRef } = React;

        // ── Inline SVG Icon Components (no external CDN needed) ───────────────
        // All lucide icons share the same SVG wrapper; only paths differ.
        const _icon = (paths) => ({ className, style }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor"
               strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
               className={className} style={style}
               dangerouslySetInnerHTML={{ __html: paths }} />
        );

        const Settings     = _icon(`<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>`);
        const FileSpreadsheet = _icon(`<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/>`);
        const Award         = _icon(`<circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>`);
        const BarChart3     = _icon(`<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>`);
        const Users         = _icon(`<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>`);
        const Plus          = _icon(`<path d="M5 12h14"/><path d="M12 5v14"/>`);
        const Target        = _icon(`<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>`);
        const Trash2        = _icon(`<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>`);
        const TrendingUp    = _icon(`<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>`);
        const Download      = _icon(`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>`);
        const Upload        = _icon(`<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/>`);
        const MinusCircle   = _icon(`<circle cx="12" cy="12" r="10"/><line x1="8" x2="16" y1="12" y2="12"/>`);
        const PlusCircle    = _icon(`<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/>`);
        const Printer       = _icon(`<polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/>`);
        const Sparkles      = _icon(`<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>`);
        const ChevronDown   = _icon(`<path d="m6 9 6 6 6-6"/>`);
        const ChevronUp     = _icon(`<path d="m18 15-6-6-6 6"/>`);
        // ─────────────────────────────────────────────────────────────────────

        // Read URL parameters (passed from faculty portal)
        const _urlParams = new URLSearchParams(window.location.search);
        const _facultyFromUrl = _urlParams.get('faculty') ? decodeURIComponent(_urlParams.get('faculty')) : '';
        const _isEmbedded = (window !== window.parent);

        // ─────────────────────────────────────────────────────────────────────
        // Labels for 13 outcome columns (11 POs + 2 PSOs)
        // ─────────────────────────────────────────────────────────────────────
        const poLabels = [
            'PO1','PO2','PO3','PO4','PO5','PO6','PO7','PO8','PO9','PO10','PO11','PSO1','PSO2'
        ];

        // ─────────────────────────────────────────────────────────────────────
        // Robust Bar Chart Component
        // ─────────────────────────────────────────────────────────────────────
        const BarChart = ({ data, colorClass }) => {
            return (
                <div className="chart-bar-area flex items-end justify-around h-56 mt-4 pt-4 border-t border-slate-200 gap-2 w-full print:border-black print:h-36">
                    {data.map((item, i) => {
                        const bars = item.values || [{ value: item.value, color: colorClass, name: '' }];
                        return (
                            <div key={i} className="flex flex-col items-center flex-1 h-full justify-end">
                                <div className="flex items-end justify-center gap-1 w-full h-full">
                                    {bars.map((bar, j) => {
                                        const safeValue = isNaN(bar.value) ? 0 : Number(bar.value);
                                        const heightPct = Math.max(2, Math.min(100, (safeValue / 3) * 100));
                                        return (
                                            <div key={j} className="flex flex-col items-center flex-1 group h-full justify-end max-w-[40px]">
                                                <div className="text-[10px] font-bold text-slate-600 mb-1 opacity-0 group-hover:opacity-100 transition-opacity print:opacity-100 print:text-black whitespace-nowrap">
                                                    {safeValue > 0 ? safeValue.toFixed(2) : '0'}
                                                </div>
                                                <div
                                                    className={`w-full rounded-t-sm transition-all duration-700 ease-out print:border print:border-black ${safeValue > 0 ? bar.color : 'bg-slate-200'}`}
                                                    style={{ height: `${heightPct}%`, WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact' }}
                                                    title={bar.name ? `${bar.name}: ${safeValue.toFixed(2)}` : safeValue.toFixed(2)}
                                                ></div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-[10px] sm:text-xs font-medium text-slate-500 mt-2 truncate w-full text-center print:text-black">
                                    {item.label}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        // ─────────────────────────────────────────────────────────────────────
        // Gemini API Integration (Exponential Backoff)
        // ─────────────────────────────────────────────────────────────────────
        const callGeminiAPI = async (prompt) => {
            const apiKey = ""; // Provide Gemini API key here if available
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-04-17:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            const retries = [1000, 2000, 4000, 8000, 16000];
            for (let attempt = 0; attempt <= retries.length; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No insights generated.";
                } catch (error) {
                    if (attempt === retries.length) throw new Error("Failed after maximum retries. Please try again later.");
                    await new Promise(resolve => setTimeout(resolve, retries[attempt]));
                }
            }
        };

        // ─────────────────────────────────────────────────────────────────────
        // Main Dashboard Component
        // ─────────────────────────────────────────────────────────────────────
        function App() {
            // Course Context State
            const [subjectName, setSubjectName] = useState('');
            const [facultyName, setFacultyName] = useState(_facultyFromUrl || '');
            const [session, setSession] = useState('');
            const [isContextOpen, setIsContextOpen] = useState(true);

            // Global Settings State
            const [examSplit, setExamSplit] = useState(20);
            const [poSplit, setPoSplit] = useState(80);
            const [coCount, setCoCount] = useState(5);

            // Independent Target Thresholds (%)
            const [targetInternal, setTargetInternal] = useState(60);
            const [targetBoard, setTargetBoard] = useState(40);
            const [targetSurvey, setTargetSurvey] = useState(70);

            const fileInputRef = useRef(null);
            const mappingInputRef = useRef(null);

            // Dynamic Initializers
            const generateEmptyMapping = () => Array(13).fill(0);

            // All CO mappings start at 0 — faculty fills them in
            const [coMappings, setCoMappings] = useState(() =>
                Array(5).fill(null).map(() => Array(13).fill(0))
            );

            // No sample students — faculty imports or adds manually
            const [students, setStudents] = useState([]);
            const [activeTab, setActiveTab] = useState(1);
            const [isGeneratingAI, setIsGeneratingAI] = useState(false);
            const [aiReport, setAiReport] = useState(null);

            // Derived Weights
            const internalWeight = examSplit / 100;
            const boardWeight = 1 - internalWeight;
            const directWeight = poSplit / 100;
            const indirectWeight = 1 - directWeight;

            // ── CO Handlers ──────────────────────────────────────────────────
            const handleAddCO = () => {
                if (coCount >= 10) { alert("Maximum 10 COs allowed."); return; }
                const newCount = coCount + 1;
                setCoCount(newCount);
                setCoMappings(prev => [...prev, generateEmptyMapping()]);
                setStudents(prev => prev.map(s => ({
                    ...s, scores: { ...s.scores, [`CO${newCount}_int`]: 0, [`CO${newCount}_ext`]: 0, [`CO${newCount}_sur`]: 0 }
                })));
            };

            const handleRemoveCO = () => {
                if (coCount <= 1) { alert("Minimum 1 CO required."); return; }
                const newCount = coCount - 1;
                setCoCount(newCount);
                if (activeTab > newCount) setActiveTab(newCount);
                setCoMappings(prev => prev.slice(0, -1));
                setStudents(prev => prev.map(s => {
                    const newScores = { ...s.scores };
                    delete newScores[`CO${coCount}_int`];
                    delete newScores[`CO${coCount}_ext`];
                    delete newScores[`CO${coCount}_sur`];
                    return { ...s, scores: newScores };
                }));
            };

            const updateMapping = (coIndex, poIndex, value) => {
                const newMappings = [...coMappings];
                newMappings[coIndex][poIndex] = Number(value);
                setCoMappings(newMappings);
            };

            const updateStudentScore = (sId, field, value) => {
                setStudents(prev => prev.map(s =>
                    s.id === sId ? { ...s, scores: { ...s.scores, [field]: Number(value) } } : s
                ));
            };

            const addStudent = () => {
                const newId = students.length > 0 ? Math.max(...students.map(s => s.id)) + 1 : 1;
                const blankScores = {};
                for (let co = 1; co <= coCount; co++) {
                    blankScores[`CO${co}_int`] = 0; blankScores[`CO${co}_ext`] = 0; blankScores[`CO${co}_sur`] = 0;
                }
                setStudents([...students, { id: newId, name: `Student ${newId}`, scores: blankScores }]);
            };

            const removeStudent = (sId) => {
                setStudents(students.filter(s => s.id !== sId));
            };

            // ── CSV Helpers ───────────────────────────────────────────────────
            const getCsvMetadataHeaders = () => {
                const safeSubject = subjectName.replace(/,/g, ' ');
                const safeFaculty = facultyName.replace(/,/g, ' ');
                const safeSession = session.replace(/,/g, ' ');
                return [
                    ["Ganga Memorial College of Polytechnic"],
                    ["OBE Attainment Calculation Dashboard"],
                    [`Subject: ${safeSubject}`, `Faculty: ${safeFaculty}`, `Session: ${safeSession}`],
                    []
                ];
            };

            const handleExportStudents = () => {
                const headers = ['ID', 'Student Name'];
                for (let i = 1; i <= coCount; i++) {
                    headers.push(`CO${i}_Internal`, `CO${i}_Board`, `CO${i}_Survey_CES`);
                }
                const rows = students.map(s => {
                    const safeName = s.name.replace(/,/g, '');
                    const row = [s.id, safeName];
                    for (let i = 1; i <= coCount; i++) {
                        row.push(s.scores[`CO${i}_int`], s.scores[`CO${i}_ext`], s.scores[`CO${i}_sur`]);
                    }
                    return row.join(',');
                });
                const csvContent = "data:text/csv;charset=utf-8," +
                    getCsvMetadataHeaders().map(r => r.join(',')).join('\n') + '\n' +
                    [headers.join(','), ...rows].join('\n');
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${subjectName.replace(/[^a-zA-Z0-9]/g, '_')}_Student_Marks.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            const handleImportStudents = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    const headerIdx = lines.findIndex(line => line.includes('ID,Student Name') || line.includes('_Internal'));
                    if (headerIdx === -1) { alert("Invalid format. Could not find student data headers."); return; }
                    const headers = lines[headerIdx].split(',');
                    let importedCoCount = 0;
                    headers.forEach(h => { if (h.includes('_Internal')) importedCoCount++; });
                    if (importedCoCount === 0) { alert("Invalid file format. Could not detect CO columns."); return; }
                    if (importedCoCount !== coCount) {
                        const userConfirm = window.confirm(`File contains ${importedCoCount} COs, but dashboard has ${coCount} COs. Update dashboard to match?`);
                        if (userConfirm) {
                            setCoCount(importedCoCount);
                            setCoMappings(prev => {
                                let newMap = [...prev];
                                if (importedCoCount > prev.length) {
                                    for (let i = prev.length; i < importedCoCount; i++) newMap.push(generateEmptyMapping());
                                } else { newMap = newMap.slice(0, importedCoCount); }
                                return newMap;
                            });
                            if (activeTab > importedCoCount) setActiveTab(importedCoCount);
                        } else { event.target.value = null; return; }
                    }
                    const parsedStudents = [];
                    for (let i = headerIdx + 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        if (cols.length < (2 + (importedCoCount * 3))) continue;
                        const scores = {};
                        let colIdx = 2;
                        for (let co = 1; co <= importedCoCount; co++) {
                            scores[`CO${co}_int`] = Number(cols[colIdx++]) || 0;
                            scores[`CO${co}_ext`] = Number(cols[colIdx++]) || 0;
                            scores[`CO${co}_sur`] = Number(cols[colIdx++]) || 0;
                        }
                        parsedStudents.push({ id: Number(cols[0]) || i, name: cols[1], scores });
                    }
                    if (parsedStudents.length > 0) {
                        setStudents(parsedStudents);
                        alert(`Successfully imported ${parsedStudents.length} students data.`);
                    }
                };
                reader.readAsText(file);
                event.target.value = null;
            };

            const handleExportMappings = () => {
                const headers = ['CO', ...poLabels];
                const rows = coMappings.map((mapRow, idx) => [`CO${idx + 1}`, ...mapRow].join(','));
                const csvContent = "data:text/csv;charset=utf-8," +
                    getCsvMetadataHeaders().map(r => r.join(',')).join('\n') + '\n' +
                    [headers.join(','), ...rows].join('\n');
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${subjectName.replace(/[^a-zA-Z0-9]/g, '_')}_Mappings.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            const handleImportMappings = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const lines = text.split('\n').filter(line => line.trim() !== '');
                    const headerIdx = lines.findIndex(line => line.startsWith('CO,PO1') || line.includes('PO1,PO2'));
                    if (headerIdx === -1) { alert("Invalid format. Could not find mapping headers."); return; }
                    const newMappings = [];
                    for (let i = headerIdx + 1; i < lines.length; i++) {
                        const cols = lines[i].split(',');
                        const mapRow = cols.slice(1, 14).map(val => Number(val) || 0);
                        while (mapRow.length < 13) mapRow.push(0);
                        newMappings.push(mapRow.slice(0, 13));
                    }
                    if (newMappings.length > 0) {
                        setCoMappings(newMappings);
                        if (newMappings.length !== coCount) {
                            setCoCount(newMappings.length);
                            setStudents(prev => prev.map(s => {
                                const newScores = { ...s.scores };
                                for (let c = 1; c <= newMappings.length; c++) {
                                    if (newScores[`CO${c}_int`] === undefined) {
                                        newScores[`CO${c}_int`] = 0; newScores[`CO${c}_ext`] = 0; newScores[`CO${c}_sur`] = 0;
                                    }
                                }
                                return { ...s, scores: newScores };
                            }));
                            if (activeTab > newMappings.length) setActiveTab(newMappings.length);
                        }
                        alert(`Successfully imported mappings for ${newMappings.length} COs.`);
                    }
                };
                reader.readAsText(file);
                event.target.value = null;
            };

            const handleExportResults = (finalMatrixData) => {
                const headers = ['Calculation Stream', ...poLabels];
                const formatRow = (label, dataArr) => [label, ...dataArr.map(val => val > 0 ? val.toFixed(2) : '-')].join(',');
                const csvContent = "data:text/csv;charset=utf-8," +
                    getCsvMetadataHeaders().map(r => r.join(',')).join('\n') + '\n' +
                    headers.join(',') + '\n' +
                    formatRow('Direct Attainment', finalMatrixData.direct) + '\n' +
                    formatRow('Indirect (CES) Attainment', finalMatrixData.indirect) + '\n' +
                    formatRow(`Final Subject Score (${poSplit}% / ${100 - poSplit}%)`, finalMatrixData.final);
                const link = document.createElement("a");
                link.setAttribute("href", encodeURI(csvContent));
                link.setAttribute("download", `${subjectName.replace(/[^a-zA-Z0-9]/g, '_')}_Final_Results.csv`);
                document.body.appendChild(link);
                link.click();
                link.remove();
            };

            // ── Print & Preview ──────────────────────────────────────────────
            const handlePrint = () => window.print();

            const handlePreviewReport = () => {
                const dashEl = document.getElementById('printable-dashboard');
                if (!dashEl) { alert('Preview unavailable.'); return; }
                const pw = window.open('', '_blank',
                    'width=1280,height=900,scrollbars=yes,resizable=yes,toolbar=no,menubar=no');
                if (!pw) {
                    alert('Popup blocked!\nPlease allow popups for this site to use Preview.\nAlternatively use the Print / Save as PDF button directly.');
                    return;
                }
                const css = [
                    '@page{size:A4 landscape;margin:8mm 10mm}',
                    '*{box-sizing:border-box}',
                    'body{margin:0;font-family:"Segoe UI",sans-serif;background:#374151}',
                    '.ptb{position:fixed;top:0;left:0;right:0;z-index:9999;background:#0f172a;color:#fff;padding:10px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.6)}',
                    '.ptb h2{font-size:15px;font-weight:700;margin:0}',
                    '.ptb p{font-size:11px;opacity:.6;margin:3px 0 0}',
                    '.ptb-btns{display:flex;gap:8px;flex-shrink:0}',
                    '.btn{padding:8px 20px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:13px}',
                    '.btn-g{background:#10b981;color:#fff}',
                    '.btn-r{background:#ef4444;color:#fff}',
                    '.paper{margin:72px auto 48px;background:#fff;padding:10mm;box-shadow:0 8px 40px rgba(0,0,0,.5);max-width:297mm}',
                    '[class*="print:block"]{display:block!important}',
                    '[class*="print:grid"]{display:grid!important}',
                    '[class*="print:hidden"]{display:none!important}',
                    '[class*="print:bg-white"]{background-color:#fff!important}',
                    '[class*="print:text-black"]{color:#000!important}',
                    '[class*="print:shadow-none"]{box-shadow:none!important}',
                    '[class*="print:border-none"]{border:none!important}',
                    '[class*="print:border-black"]{border-color:#000!important}',

                const html = '<!DOCTYPE html><html lang="en"><head>'

                setIsGeneratingAI(true);

                    const prompt = `Act as an academic expert in Outcome-Based Education (OBE) and NBA/AICTE accreditation.
Subject: ${subjectName}
Faculty: ${facultyName}

Final Program Outcome (PO) and PSO Attainments (Max score is 3.0):
${poLabels.map((l, i) => `${l}: ${calculatePO.final[i].toFixed(2)}`).join('\n')}

Analyze this data. Identify the top 2 weakest outcomes (ignoring scores of 0.00 if they are unmapped). Provide 3 specific, actionable pedagogical strategies (like teaching methodologies, assignments, or practicals) to improve student attainment in these weak areas for the next academic session. Format using clean HTML with bold tags and bullet points. Do not use Markdown formatting in the response. Make it concise and professional.`;
                    const responseText = await callGeminiAPI(prompt);
                    setAiReport(responseText);
                } catch (error) {
                    setAiReport("Error generating insights: " + error.message + "<br><br><strong>Note:</strong> To use this feature, a valid Gemini API key must be configured in nba-dashboard.html.");
                } finally {
                    setIsGeneratingAI(false);
                }
            };

            // ── Core OBE Calculations ─────────────────────────────────────────
            const derivedCOs = useMemo(() => {
                return coMappings.map((mappings, idx) => {
                    const coNum = idx + 1;
                    const keyInt = `CO${coNum}_int`, keyExt = `CO${coNum}_ext`, keySur = `CO${coNum}_sur`;
                    let passInt = 0, passExt = 0, passSur = 0;
                    const total = students.length;
                    const markTargetInt = 20 * (targetInternal / 100);
                    const markTargetExt = 70 * (targetBoard / 100);
                    const markTargetSur = 3 * (targetSurvey / 100);
                    students.forEach(s => {
                        if (s.scores[keyInt] !== undefined && s.scores[keyInt] >= markTargetInt) passInt++;
                        if (s.scores[keyExt] !== undefined && s.scores[keyExt] >= markTargetExt) passExt++;
                        if (s.scores[keySur] !== undefined && s.scores[keySur] >= markTargetSur) passSur++;
                    });
                    const getLevel = (passCount) => {
                        if (total === 0) return 0;
                        const pct = (passCount / total) * 100;
                        if (pct >= 70) return 3;
                        if (pct >= 60) return 2;
                        if (pct >= 50) return 1;
                        return 0;
                    };
                    const internalLevel = getLevel(passInt), boardLevel = getLevel(passExt), indirectLevel = getLevel(passSur);
                    const directAttainment = (internalLevel * internalWeight) + (boardLevel * boardWeight);
                    const totalAttainment = (directAttainment * directWeight) + (indirectLevel * indirectWeight);
                    return {
                        id: `CO${coNum}`,
                        internal: internalLevel, board: boardLevel, indirect: indirectLevel,
                        intPct: total ? ((passInt / total) * 100).toFixed(0) : 0,
                        extPct: total ? ((passExt / total) * 100).toFixed(0) : 0,
                        surPct: total ? ((passSur / total) * 100).toFixed(0) : 0,
                        directAttainment, totalAttainment, mappings
                    };
                });
            }, [students, targetInternal, targetBoard, targetSurvey, coMappings, internalWeight, boardWeight, directWeight, indirectWeight]);

            const calculatePO = useMemo(() => {
                const totalOutcomes = poLabels.length;
                const results = { direct: Array(totalOutcomes).fill(0), indirect: Array(totalOutcomes).fill(0), final: Array(totalOutcomes).fill(0) };
                for (let p = 0; p < totalOutcomes; p++) {
                    let sumMap = 0, sumProductDirect = 0, sumProductIndirect = 0;
                    derivedCOs.forEach(co => {
                        const mapVal = co.mappings[p];
                        if (mapVal > 0) {
                            sumMap += mapVal;
                            sumProductDirect += co.directAttainment * mapVal;
                            sumProductIndirect += co.indirect * mapVal;
                        }
                    });
                    if (sumMap > 0) {
                        results.direct[p] = sumProductDirect / sumMap;
                        results.indirect[p] = sumProductIndirect / sumMap;
                        results.final[p] = (results.direct[p] * directWeight) + (results.indirect[p] * indirectWeight);
                    }
                }

                                                <tr key={student.id} className="hover:bg-slate-50/50">
                                                    <td className="px-4 py-3 font-medium text-slate-700 whitespace-nowrap">{student.name}</td>
                                                    <td className="px-4 py-3 min-w-[120px]"><input type="number" min="0" max="20" value={intVal} onChange={(e) => updateStudentScore(student.id, `CO${activeTab}_int`, e.target.value)} className={`w-full text-center border rounded p-1.5 outline-none focus:ring-2 focus:ring-indigo-500 ${intPass ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-slate-300'}`} /></td>
                                                    <td className="px-4 py-3 min-w-[120px]"><input type="number" min="0" max="70" value={extVal} onChange={(e) => updateStudentScore(student.id, `CO${activeTab}_ext`, e.target.value)} className={`w-full text-center border rounded p-1.5 outline-none focus:ring-2 focus:ring-indigo-500 ${extPass ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-slate-300'}`} /></td>
                                                    <td className="px-4 py-3 min-w-[120px]"><input type="number" min="0" max="3" step="1" value={surVal} onChange={(e) => updateStudentScore(student.id, `CO${activeTab}_sur`, e.target.value)} className={`w-full text-center border rounded p-1.5 outline-none focus:ring-2 focus:ring-indigo-500 ${surPass ? 'bg-emerald-50 border-emerald-200' : 'bg-white border-slate-300'}`} /></td>
                                                    <td className="px-4 py-3 text-center"><button onClick={() => removeStudent(student.id)} className="text-slate-400 hover:text-rose-500 transition-colors"><Trash2 className="w-5 h-5 mx-auto" /></button></td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Phase 2 - CO Attainment Summary & PO Mapping Matrix */}
                        <div id="phase2-section" className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden page-break-before break-inside-avoid print:border-black print:rounded-none print:shadow-none print:mt-8">
                            <div className="p-6 border-b border-slate-200 bg-slate-50 flex flex-col md:flex-row md:items-center justify-between gap-4 print:bg-white print:border-black print:p-4">
                                <div className="flex items-center gap-2">
                                    <FileSpreadsheet className="w-5 h-5 text-indigo-600 print:hidden" />
                                    <h2 className="text-lg font-bold print:text-base print:uppercase print:tracking-wider print:text-black">Phase 2: CO Attainment &amp; Mapping Analysis</h2>
                                </div>
                                <div className="flex flex-wrap items-center gap-2 print:hidden">
                                    <div className="flex items-center gap-2 bg-white border border-slate-300 px-2 py-1 rounded-md mr-2">
                                        <span className="text-xs font-bold text-slate-500">COs: {coCount}</span>
                                        <button onClick={handleRemoveCO} className="hover:bg-slate-100 p-1 rounded text-slate-500"><MinusCircle className="w-4 h-4" /></button>
                                        <button onClick={handleAddCO} className="hover:bg-slate-100 p-1 rounded text-indigo-600"><PlusCircle className="w-4 h-4" /></button>
                                    </div>
                                    <input type="file" accept=".csv" ref={mappingInputRef} onChange={handleImportMappings} className="hidden" />
                                    <button onClick={handleExportMappings} className="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-md transition-colors">
                                        <Download className="w-4 h-4 text-slate-500" /> Export
                                    </button>
                                    <button onClick={() => mappingInputRef.current.click()} className="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-md transition-colors">
                                        <Upload className="w-4 h-4 text-emerald-500" /> Import
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-x-auto relative">
                                <table id="phase2-table" className="w-full text-sm text-left print:text-xs print:border-collapse table-fixed">
                                    <thead className="text-xs text-slate-600 uppercase bg-slate-100/50 print:bg-slate-100 print:text-black border print:border-black">
                                        <tr>
                                            <th className="px-4 py-3 font-bold border-b border-r border-slate-200 bg-slate-100/50 sticky left-0 z-10 print:border-black print:bg-slate-100 print:p-1 w-16" rowSpan="2">CO</th>
                                            <th className="px-4 py-3 font-bold text-center border-b border-r border-slate-200 print:border-black print:p-1" colSpan="3">Attainment Levels</th>
                                            <th className="px-4 py-3 font-bold text-center bg-indigo-50/50 text-indigo-800 border-b border-r border-slate-200 print:border-black print:bg-slate-50 print:text-black print:p-1" colSpan="3">CO Attainment</th>
                                            <th className="px-4 py-3 font-bold text-center border-b border-slate-200 print:border-black print:p-1" colSpan={poLabels.length}>Mapping Strengths (0-3)</th>
                                        </tr>
                                        <tr>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1">Int</th>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1">Brd</th>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1">CES</th>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1 bg-indigo-50/50 text-indigo-800">Dir</th>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1 bg-purple-50/50 text-purple-800">Ind</th>
                                            <th className="px-2 py-2 font-medium text-center border-b border-r border-slate-200 w-12 print:border-black print:p-1 bg-emerald-50/50 text-emerald-800">Total</th>
                                            {poLabels.map(label => (
                                                <th key={`head-${label}`} className={`px-2 py-2 font-medium text-center border-b border-l border-slate-200 w-10 print:border-black print:p-1 ${label.startsWith('PSO') ? 'bg-amber-50/50 print:bg-slate-50' : ''}`}>
                                                    {label}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 print:divide-black">
                                        {derivedCOs.map((co, idx) => (
                                            <tr key={co.id} className="hover:bg-slate-50 transition-colors print:border-black">
                                                <td className="px-4 py-4 font-bold text-slate-800 border-r border-slate-200 bg-white sticky left-0 z-10 print:border-black print:p-1 print:shadow-none text-black">{co.id}</td>
                                                <td className="px-2 py-2 border-r border-slate-200 text-center print:border-black print:p-1">
                                                    <div className={`inline-flex flex-col items-center px-2 py-1 rounded border ${getBadgeClass(co.internal)} w-full print:border-none print:p-0 text-black`}>
                                                        <span className="font-bold whitespace-nowrap">{co.internal}</span>
                                                    </div>
                                                </td>
                                                <td className="px-2 py-2 border-r border-slate-200 text-center print:border-black print:p-1">
                                                    <div className={`inline-flex flex-col items-center px-2 py-1 rounded border ${getBadgeClass(co.board)} w-full print:border-none print:p-0 text-black`}>
                                                        <span className="font-bold whitespace-nowrap">{co.board}</span>
                                                    </div>
                                                </td>
                                                <td className="px-2 py-2 border-r border-slate-200 text-center print:border-black print:p-1">
                                                    <div className={`inline-flex flex-col items-center px-2 py-1 rounded border ${getBadgeClass(co.indirect)} w-full print:border-none print:p-0 text-black`}>
                                                        <span className="font-bold whitespace-nowrap">{co.indirect}</span>
                                                    </div>
                                                </td>
                                                <td className="px-2 py-2 text-center font-bold text-indigo-700 bg-indigo-50/30 border-r border-slate-200 print:bg-white print:text-black print:border-black print:p-1 text-sm">{co.directAttainment.toFixed(2)}</td>
                                                <td className="px-2 py-2 text-center font-bold text-purple-700 bg-purple-50/30 border-r border-slate-200 print:bg-white print:text-black print:border-black print:p-1 text-sm">{co.indirect.toFixed(2)}</td>
                                                <td className="px-2 py-2 text-center font-bold text-emerald-700 bg-emerald-50/30 border-r border-slate-200 print:bg-white print:text-black print:border-black print:p-1 text-sm">{co.totalAttainment.toFixed(2)}</td>
                                                {co.mappings.map((mapVal, poIdx) => (
                                                    <td key={`map-${idx}-${poIdx}`} className={`px-2 py-2 border-l border-slate-200 print:border-black print:p-1 ${poIdx >= 11 ? 'bg-amber-50/30 print:bg-white' : ''}`}>
                                                        <select
                                                            value={mapVal}
                                                            onChange={(e) => updateMapping(idx, poIdx, e.target.value)}
                                                            className={`w-full bg-transparent border-none rounded p-1 text-center font-bold outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer appearance-none print:p-0 text-black ${mapVal === 0 ? 'text-slate-300 print:text-slate-400' : 'text-slate-700 print:text-black'} text-base`}
                                                        >
                                                            <option value="0">-</option><option value="1">1</option><option value="2">2</option><option value="3">3</option>
                                                        </select>
                                                    </td>
                                                ))}
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Phase 3 - Final Consolidated PO Output */}
                        <div id="phase3-section" className="bg-slate-900 rounded-2xl shadow-xl overflow-hidden border border-slate-800 break-inside-avoid print:bg-white print:shadow-none print:border-black print:rounded-none print:mt-8">
                            <div className="p-6 border-b border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4 print:border-black print:p-4">
                                <div className="flex items-center gap-2">
                                    <Award className="w-6 h-6 text-emerald-400 print:hidden" />
                                    <h2 className="text-xl font-bold text-white print:text-base print:uppercase print:tracking-wider print:text-black">Phase 3: Final Consolidated Matrix</h2>
                                </div>
                                <div className="flex items-center gap-3 print:hidden">
                                    <button onClick={() => handleExportResults(calculatePO)} className="flex items-center gap-2 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg transition-colors shadow-lg">
                                        <Download className="w-4 h-4" /> Export CSV
                                    </button>
                                </div>
                            </div>
                            <div className="overflow-x-auto p-4 print:p-0">
                                <table id="phase3-table" className="w-full text-sm text-center print:text-sm print:border-collapse table-fixed">
                                    <thead>
                                        <tr className="border print:border-black">
                                            <th className="text-left px-4 py-3 text-slate-400 uppercase text-xs tracking-wider sticky left-0 bg-slate-900 z-10 w-48 print:bg-slate-100 print:text-black print:border print:border-black print:p-3">Calculation Stream</th>
                                            {poLabels.map(label => (
                                                <th key={`final-head-${label}`} className={`px-4 py-3 font-bold text-lg print:border print:border-black print:text-black print:text-base print:bg-slate-100 print:p-3 ${label.startsWith('PSO') ? 'text-amber-400' : 'text-white'}`}>
                                                    {label}
                                                </th>
                                            ))}
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50 print:divide-black text-black border print:border-black">
                                        <tr className="hover:bg-slate-800/50 transition-colors print:border-black">
                                            <td className="text-left px-4 py-4 text-slate-300 font-medium sticky left-0 bg-slate-900 z-10 print:bg-white print:text-black print:border print:border-black print:shadow-none print:p-3">Direct Attainment</td>
                                            {calculatePO.direct.map((val, i) => (
                                                <td key={`dir-${i}`} className="px-4 py-4 print:border print:border-black print:p-3">
                                                    <span className="px-3 py-1 bg-slate-800 text-slate-300 rounded border border-slate-700 print:bg-white print:text-black print:border-none print:p-0 print:font-medium">
                                                        {val > 0 ? val.toFixed(2) : '-'}
                                                    </span>
                                                </td>
                                            ))}
                                        </tr>
                                        <tr className="hover:bg-slate-800/50 transition-colors print:border-black">
                                            <td className="text-left px-4 py-4 text-slate-300 font-medium sticky left-0 bg-slate-900 z-10 print:bg-white print:text-black print:border print:border-black print:shadow-none print:p-3">Indirect (CES) Attainment</td>
                                            {calculatePO.indirect.map((val, i) => (
                                                <td key={`ind-${i}`} className="px-4 py-4 print:border print:border-black print:p-3">
                                                    <span className="px-3 py-1 bg-slate-800 text-slate-300 rounded border border-slate-700 print:bg-white print:text-black print:border-none print:p-0 print:font-medium">
                                                        {val > 0 ? val.toFixed(2) : '-'}
                                                    </span>
                                                </td>
                                            ))}
                                        </tr>
                                        <tr className="bg-indigo-900/20 print:bg-slate-50 print:border-black">
                                            <td className="text-left px-4 py-6 text-white font-bold text-base sticky left-0 bg-slate-900 z-10 print:bg-slate-50 print:text-black print:border print:border-black print:shadow-none print:p-3">
                                                Final Subject Score
                                            </td>
                                            {calculatePO.final.map((val, i) => (
                                                <td key={`fin-${i}`} className="px-4 py-6 print:border print:border-black print:p-3">
                                                    {val > 0 ? (
                                                        <span className={`px-4 py-2 rounded-lg border text-lg font-bold print:border-none print:p-0 text-black ${getFinalColorClass(val)}`}>
                                                            {val.toFixed(2)}
                                                        </span>
                                                    ) : (
                                                        <span className="text-slate-600 print:text-slate-400">-</span>
                                                    )}
                                                </td>
                                            ))}
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Phase 4 - Analytics & Visualization */}
                        <div id="phase4-charts" className="grid lg:grid-cols-2 gap-6 pt-4 break-inside-avoid print:grid print:grid-cols-2 print:mt-4 print:pt-2 print:gap-4">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col min-h-[350px] print:border print:border-black print:p-3 print:shadow-none print:min-h-0">
                                <div className="flex flex-col mb-4 border-b border-slate-200 pb-2 print:border-black">
                                    <div className="flex items-center gap-2 text-slate-700">
                                        <TrendingUp className="w-5 h-5 text-indigo-600 print:hidden" />
                                        <h2 className="text-lg font-bold print:text-base print:uppercase print:tracking-wider print:text-black">Course Outcome (CO) Performance</h2>
                                    </div>
                                    <div className="flex gap-4 justify-start mt-2 text-xs font-medium text-slate-600 print:text-black">
                                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-indigo-500 rounded-sm"></div> Direct</span>
                                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-purple-400 rounded-sm"></div> Indirect</span>
                                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-500 rounded-sm"></div> Total</span>
                                    </div>
                                </div>
                                <div className="flex-1 w-full flex flex-col">
                                    <BarChart
                                        data={derivedCOs.map(co => ({
                                            label: co.id,
                                            values: [
                                                { value: co.directAttainment, color: 'bg-indigo-500', name: 'Direct' },
                                                { value: co.indirect, color: 'bg-purple-400', name: 'Indirect' },
                                                { value: co.totalAttainment, color: 'bg-emerald-500', name: 'Total' }
                                            ]
                                        }))}
                                    />
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col min-h-[350px] print:border print:border-black print:p-3 print:shadow-none print:min-h-0">
                                <div className="flex flex-col mb-4 border-b border-slate-200 pb-2 print:border-black">
                                    <div className="flex items-center gap-2 text-slate-700">
                                        <BarChart3 className="w-5 h-5 text-emerald-600 print:hidden" />
                                        <h2 className="text-lg font-bold print:text-base print:uppercase print:tracking-wider print:text-black">Program Outcomes (PO &amp; PSO) Mastery</h2>
                                    </div>
                                    <div className="flex gap-4 justify-start mt-2 text-xs font-medium text-slate-600 print:text-black">
                                        <span className="flex items-center gap-1"><div className="w-3 h-3 bg-emerald-500 rounded-sm"></div> Final Matrix Target Score</span>
                                    </div>
                                </div>
                                <div className="flex-1 w-full flex flex-col">
                                    <BarChart
                                        data={calculatePO.final.map((val, i) => ({ label: poLabels[i], value: val }))}
                                        colorClass="bg-emerald-500 print:shadow-none"
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Phase 5 - AI Continuous Quality Improvement (CQI) */}
                        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl shadow-sm border border-indigo-100 overflow-hidden break-inside-avoid print:bg-white print:border-black print:rounded-none print:shadow-none print:mt-10">
                            <div className="p-6 border-b border-indigo-100 flex flex-col md:flex-row md:items-center justify-between gap-4 print:border-black print:p-4">
                                <div className="flex items-center gap-2">
                                    <Sparkles className="w-6 h-6 text-indigo-600 print:hidden" />
                                    <h2 className="text-xl font-bold text-indigo-900 print:text-base print:uppercase print:tracking-wider print:text-black">Phase 5: Quality Improvement Strategies</h2>
                                </div>
                                <div className="flex items-center gap-3 print:hidden">
                                    <button
                                        onClick={handleGenerateAIInsights}
                                        disabled={isGeneratingAI}
                                        className="flex items-center gap-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-300 text-white text-sm font-bold rounded-lg transition-colors shadow-md"
                                    >
                                        {isGeneratingAI ? (
                                            <span className="flex items-center gap-2"><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Generating...</span>
                                        ) : (
                                            <><Sparkles className="w-4 h-4" /> ✨ Generate AI Action Plan</>
                                        )}
                                    </button>
                                </div>
                            </div>
                            <div className="p-6 print:p-6">
                                {!aiReport && !isGeneratingAI && (
                                    <div className="text-center text-slate-500 py-8 print:hidden">
                                        Click the "Generate AI Action Plan" button to analyze your final PO matrix and receive expert pedagogical improvement strategies.
                                        <br /><span className="text-xs text-slate-400 mt-2 block">Requires a valid Gemini API key to be configured in nba-dashboard.html</span>
                                    </div>
                                )}
                                {!aiReport && !isGeneratingAI && (
                                    <div className="hidden print:block text-slate-800 text-sm">
                                        *AI Improvement analysis was not generated for this session.*
                                    </div>
                                )}
                                {isGeneratingAI && (
                                    <div className="text-center text-indigo-500 font-medium py-8 animate-pulse print:hidden">
                                        Analyzing PO Attainment Data &amp; Generating Expert Insights...
                                    </div>
                                )}
                                {aiReport && (
                                    <div
                                        className="text-slate-800 space-y-3 prose max-w-none print:text-black print:text-sm"
                                        dangerouslySetInnerHTML={{ __html: aiReport }}
                                    />
                                )}
                            </div>
                        </div>

                        {/* Preview & Print Buttons */}
                        <div className="mt-12 flex flex-col sm:flex-row justify-center gap-4 pb-8 print:hidden">
                            <button
                                onClick={handlePreviewReport}
                                className="flex items-center justify-center gap-3 px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white text-lg font-bold rounded-2xl transition-all shadow-lg hover:shadow-xl hover:-translate-y-0.5"
                            >
                                <span style={{fontSize:'1.25rem'}}>👁</span>
                                <span>Preview Report</span>
                            </button>
                            <button
                                onClick={handlePrint}
                                className="flex items-center justify-center gap-3 px-8 py-4 bg-slate-900 hover:bg-slate-800 text-white text-lg font-bold rounded-2xl transition-all shadow-xl hover:shadow-2xl hover:-translate-y-1 group"
                            >
                                <Printer className="w-6 h-6 text-indigo-400 group-hover:text-indigo-300" />
                                <span>Print / Save as PDF</span>
                            </button>
                        </div>

                    </div>
                </div>
            );
        }

        // ─────────────────────────────────────────────────────────────────────
        // Mount the React App
        // ─────────────────────────────────────────────────────────────────────
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
